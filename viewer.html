<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TTT 스윙 뷰어</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  header, #ctl { padding: 12px 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; height: 60vh; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; height: auto; } #view, video { height: 45vh; } }
  video, #view { width: 100%; height: 100%; background: #000; border-radius: 8px; overflow: hidden; }
  #seek { flex: 1; min-width: 160px; }
  #report { padding: 0 16px 24px; white-space: pre-wrap; font: 14px/1.6 ui-monospace, monospace; }
  button, select { background: #333; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <b>TTT 스윙 뷰어</b>
  <label>분석 JSON <input type="file" id="json" accept=".json"></label>
  <label>원본 영상(선택) <input type="file" id="vid" accept="video/*"></label>
</header>
<main><video id="video" muted playsinline></video><div id="view"></div></main>
<div id="ctl">
  <button id="play">▶</button>
  <select id="rate"><option value="0.25">0.25x</option><option value="0.5">0.5x</option><option value="1" selected>1x</option></select>
  <input type="range" id="seek" min="0" value="0">
  <span id="fl">-</span>
  <button data-ph="백스윙">백스윙</button><button data-ph="임팩트">임팩트</button><button data-ph="피니시">피니시</button>
</div>
<div id="report">분석 JSON 파일을 열어 주세요. (uv run swing.py 영상.mp4 로 만듭니다)
3D 화면은 드래그로 돌리고, 휠로 확대합니다. 손목 궤적 색: 파랑(느림) → 빨강(빠름), 빨간 점 = 임팩트</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $ = id => document.getElementById(id);
const view = $('view'), video = $('video');

const renderer = new THREE.WebGLRenderer({ antialias: true });
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
camera.position.set(0, 0.2, 3);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
scene.add(new THREE.GridHelper(4, 20, 0x444444, 0x222222).translateY(-1));

const bones = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffffff }));
const joints = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color: 0x4fc3f7, size: 0.04 }));
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.03), new THREE.MeshBasicMaterial({ color: 0xff1744 }));
bones.frustumCulled = joints.frustumCulled = false;
scene.add(bones, joints, marker);

let data = null, trail = null, frame = 0, playing = false, last = 0;
// MediaPipe 좌표는 y가 아래, z가 카메라 쪽이라 뒤집어서 그린다
const P = (f, j) => { const [x, y, z] = data.frames[f][j]; return [x, -y, -z]; };

function load(d) {
  data = d;
  $('seek').max = d.frames.length - 1;
  if (trail) scene.remove(trail);
  const max = Math.max(...d.speed) || 1, pos = [], col = [];
  d.frames.forEach((_, f) => {
    pos.push(...P(f, d.wrist_index));
    const c = new THREE.Color().setHSL(0.66 * (1 - d.speed[f] / max), 1, 0.5);
    col.push(c.r, c.g, c.b);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  trail = new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true }));
  scene.add(trail);
  marker.position.set(...P(d.metrics.phases['임팩트'], d.wrist_index));
  $('report').textContent = d.report;
  show(0);
}

function show(f) {
  frame = Math.max(0, Math.min(f, data.frames.length - 1));
  bones.geometry.setAttribute('position', new THREE.Float32BufferAttribute(
    data.connections.flatMap(([a, b]) => [...P(frame, a), ...P(frame, b)]), 3));
  joints.geometry.setAttribute('position', new THREE.Float32BufferAttribute(
    data.frames[frame].flatMap((_, j) => P(frame, j)), 3));
  $('seek').value = frame;
  $('fl').textContent = `${frame} / ${data.frames.length - 1} · 손목 ${data.speed[frame].toFixed(1)} m/s`;
}

function go(f) {
  if (!data) return;
  if (video.src) video.currentTime = f / data.fps;
  show(f);
}

$('json').onchange = async e => load(JSON.parse(await e.target.files[0].text()));
$('vid').onchange = e => { video.src = URL.createObjectURL(e.target.files[0]); video.playbackRate = +$('rate').value; };
$('rate').onchange = () => { video.playbackRate = +$('rate').value; };
$('seek').oninput = e => go(+e.target.value);
document.querySelectorAll('[data-ph]').forEach(b => b.onclick = () => data && go(data.metrics.phases[b.dataset.ph]));
$('play').onclick = () => {
  if (!data) return;
  if (video.src) return video.paused ? video.play() : video.pause();
  playing = !playing;
  $('play').textContent = playing ? '⏸' : '▶';
};
video.onplay = () => $('play').textContent = '⏸';
video.onpause = () => $('play').textContent = '▶';

(function loop(t) {
  requestAnimationFrame(loop);
  if (data) {
    if (video.src && !video.paused) show(Math.floor(video.currentTime * data.fps));
    else if (playing && t - last > 1000 / data.fps / $('rate').value) { last = t; show((frame + 1) % data.frames.length); }
  }
  const w = view.clientWidth, h = view.clientHeight;
  if (renderer.domElement.width !== Math.floor(w * devicePixelRatio)) {
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  controls.update();
  renderer.render(scene, camera);
})(0);
</script>
</body>
</html>
